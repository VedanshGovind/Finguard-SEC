<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Finguard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/styles.css">
<script src="js/common.js"></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="scan" aria-hidden="true"></div>
<main class="login-wrap">
  <section class="login-card" id="card">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
      FINGUARD AI
    </div>
    <p class="boot mono" id="boot" aria-live="polite"></p>
    <form id="form" novalidate>
      <label for="u">Operator ID</label><input id="u" name="username" autocomplete="username" autofocus required>
      <label for="p">Passphrase</label><input id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="form-err" id="err" role="alert" hidden></div>
      <button class="btn-fg" id="go" type="submit">AUTHENTICATE</button>
    </form>
  </section>
</main>
<div class="file-note mono" id="fileNote" hidden>Opened from a local file. Run <b>python -m app.main</b> and visit http://localhost:8000</div>
<script src="js/login.js"></script>
</body>
</html>
